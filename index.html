<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI大喜利</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#4a3428;--accent:#ff7a59;--sub:#8a6f60;--line:#f0d9c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
h1{margin:0;font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer;font-weight:bold}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
#status{font-size:13px;color:var(--sub)}
#bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
#bar i{display:block;height:100%;width:0;background:var(--accent)}
#odai{font-size:clamp(26px,4.5vw,46px);font-weight:bold;text-align:center;padding:22px 8px;line-height:1.4}
#phase{text-align:center;color:var(--sub);font-size:15px}
#timer{text-align:center;font-size:32px;font-weight:bold;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.list{display:grid;gap:8px;max-height:46vh;overflow:auto}
.ans{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fffdf9;animation:pop .3s}
.ans b{color:var(--accent)}
.ans .who{font-size:12px;color:var(--sub)}
.rank{display:grid;grid-template-columns:48px 1fr 56px;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fffdf9;animation:pop .4s}
.rank .n{font-size:24px;font-weight:bold;color:var(--accent);text-align:center}
.rank .pt{font-size:22px;font-weight:bold;text-align:right}
.rank.top{background:#fff0d6;border-color:#ffb347}
.cm{font-size:13px;color:var(--sub)}
.total{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px dashed var(--line)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
small{color:var(--sub)}
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="row"><h1>🎤 AI大喜利</h1><span id="status">準備中…</span></div>
    <div id="bar"><i></i></div>
    <div class="row" style="margin-top:10px">
      <label>Twitchチャンネル <input id="ch" value="tomochiiradio" size="16"></label>
      <label>回答時間 <select id="sec"><option>30</option><option selected>60</option><option>90</option><option>120</option></select>秒</label>
      <label><input type="checkbox" id="voice" checked style="width:auto"> ボイス</label>
      <label>声 <select id="vmode"><option value="browser">ブラウザ標準</option><option value="vv">VOICEVOX（自然）</option></select></label>
      <label>話者ID <input id="vvsp" type="number" value="3" style="width:64px" title="3=ずんだもん 2=四国めたん 8=春日部つむぎ"></label>
      <button id="btnVoiceTest" class="ghost">声テスト</button>
      <label><input type="checkbox" id="sfx" checked style="width:auto"> 効果音</label>
      <button id="btnAI" class="ghost">AIを読み込む（約1GB・初回のみ）</button>
      <button id="btnStart">ゲーム開始</button>
      <button id="btnSkip" class="ghost" disabled>回答を締め切る</button>
    </div>
    <small>AIなしでも遊べます（お題は用意済みの中から、採点は適当な点数とひとことになります）。チャットで普通に書き込むと回答になります（1人1回・40文字まで）。</small>
  </div>

  <div class="card">
    <div id="phase">「ゲーム開始」を押してください</div>
    <div id="odai">お題がここに出ます</div>
    <div id="timer"></div>
  </div>

  <div class="cols">
    <div class="card"><b>📨 みんなの回答（<span id="cnt">0</span>）</b><div id="answers" class="list" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px"><input id="test" placeholder="テスト回答（配信なしで試す）" style="flex:1"><button id="btnTest" class="ghost">送る</button></div>
    </div>
    <div class="card"><b>🏆 今回のランキング</b><div id="ranking" class="list" style="margin-top:8px"></div>
      <b style="display:block;margin-top:12px">📊 累計ポイント</b><div id="totals" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ===== 効果音（sfx/フォルダのmp3。無ければ無音）=====
function sfx(name, loop=false){
  if(!$('sfx').checked) return null;
  try{ const a = new Audio('sfx/' + name + '.mp3'); a.volume = 0.7; a.loop = loop; a.play().catch(()=>{}); return a; }catch(e){ return null; }
}
function sfxWait(name, ms){
  return new Promise(res => { const a = sfx(name); if(!a) return res(); a.onended = a.onerror = () => res(); setTimeout(res, ms); });
}
let loopA = null;
const startLoop = name => { stopLoop(); loopA = sfx(name, true); };
const stopLoop = () => { if(loopA){ loopA.pause(); loopA = null; } };

// ===== ボイス =====
let vvWarned = false;
async function speakVV(text){
  const base = 'http://127.0.0.1:50021', sp = parseInt($('vvsp').value,10) || 3;
  const q = await fetch(`${base}/audio_query?speaker=${sp}&text=${encodeURIComponent(text)}`, {method:'POST'});
  if(!q.ok) throw new Error('audio_query');
  const query = await q.json(); query.speedScale = 1.1;
  const w = await fetch(`${base}/synthesis?speaker=${sp}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(query)});
  if(!w.ok) throw new Error('synthesis');
  const url = URL.createObjectURL(await w.blob());
  return new Promise(res => { const a = new Audio(url); a.onended = a.onerror = () => { URL.revokeObjectURL(url); res(); }; a.play().catch(()=>res()); });
}
function speakBrowser(text){
  if(!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
    if(v) u.voice = v;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
    setTimeout(res, 12000);
  });
}
async function speak(text){
  if(!$('voice').checked) return;
  if($('vmode').value === 'vv'){
    try{ await speakVV(text); return; }
    catch(e){ if(!vvWarned){ vvWarned = true; status('VOICEVOXにつながりません。起動と許可の設定を確認してください（ブラウザ標準の声で続けます）'); } }
  }
  await speakBrowser(text);
}
$('btnVoiceTest').onclick = () => speak('こんにちは。AI大喜利の司会です。よろしくお願いします。');

// ===== AI（WebLLM）=====
let engine = null;
const MODEL = 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC';
$('btnAI').onclick = async () => {
  if(!navigator.gpu){ status('このブラウザはWebGPU非対応です。通常のChromeで開いてください（AIなしで遊べます）'); return; }
  $('btnAI').disabled = true;
  try{
    const webllm = await import('https://esm.run/@mlc-ai/web-llm');
    engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: p => { status('AI読み込み中：' + p.text); $('bar').firstElementChild.style.width = Math.round((p.progress||0)*100) + '%'; }
    });
    status('AIの準備ができました');
    $('btnAI').textContent = 'AI読み込み済み ✔';
  }catch(e){
    console.error(e); engine = null; $('btnAI').disabled = false;
    status('AIの読み込みに失敗しました：' + (e.message||e) + '（AIなしで遊べます）');
  }
};
async function ask(system, user, max=60, shots=[], temp=0.9){
  const messages=[{role:'system',content:system}];
  for(const [u,a] of shots){ messages.push({role:'user',content:u},{role:'assistant',content:a}); }
  messages.push({role:'user',content:user});
  const r = await engine.chat.completions.create({messages, temperature:temp, top_p:0.95, max_tokens:max});
  return (r.choices[0].message.content||'').trim();
}

// ===== お題 =====
const ODAI = [
 'こんな配信者は嫌だ。どんな配信者？','コンビニの新商品。その名前は？','犬が突然しゃべりだした。最初の一言は？',
 '朝起きたら枕元にいたもの。それは？','AIが人間にこっそり隠していること。それは？','カレーに入れてはいけないもの。それは？',
 '宇宙人が地球で最初に覚えた日本語は？','こんなゲームはクソゲー。どんなゲーム？','校長先生の話が長い本当の理由は？',
 'この配信の裏側で起きていること。それは？','サンタが来年はやめようと思った理由は？','魔王が勇者に言った意外な一言は？',
 'ラーメン屋の大将が急に無口になった。その理由は？','新幹線の車内アナウンスで絶対に流れてはいけない一言は？','猫が会議に出席。第一声は？',
 '100円ショップで売っていて驚いたもの。それは？','勇者のパーティーを追放された理由は？','カラオケで歌うと一気に空気が変わる曲。どんな曲？',
 '冷蔵庫を開けたら入っていてほしくないもの。それは？','このコメント欄が今夜だけ守るルール。それは？','おばあちゃんの家にだけある謎のルール。それは？',
 '履歴書の特技欄に書いたら採用されたこと。それは？','ドラゴンが勇者を倒さなかった理由は？','温泉の効能に書いてあって怖かったこと。それは？',
 '実は全員やっているのに誰も言わないこと。それは？','ゲームのチュートリアルで急に心が折れる一言は？','神様が初めて人間に送ったLINE。その内容は？',
 '「その発想はなかった」と言われた、夏休みの自由研究。何を調べた？','ロボットが初めて覚えた感情。それは？','寝坊した言い訳で一番ひどいもの。それは？'
];
const THEMES = ['配信','ゲーム','コンビニ','学校','動物','宇宙','異世界','料理','家電','カフェ','温泉','ヒーロー','会社','電車','AI','お正月','夏休み','恋愛','ペット','魔法','コンビニ弁当','スマホ','ラーメン','おばあちゃん','勇者と魔王'];
let lastOdai = '';
function pick(arr,n){ return [...arr].sort(()=>Math.random()-.5).slice(0,n); }
async function makeOdai(){
  if(engine){
    for(let k=0;k<2;k++){
      try{
        const ex = pick(ODAI,4), theme = pick(THEMES,1)[0];
        const t = await ask(
          'あなたは大喜利番組の放送作家です。誰でも一言で答えられて、答えが人によってバラバラになる、おもしろいお題を1つだけ作ります。お題の1文だけを出力し、答えや説明は書きません。難しい言葉は使いません。',
          '次のお題と同じ雰囲気で、まったく新しいお題を作ってください。\n' + ex.map(e=>'・'+e).join('\n') + '\nテーマ：' + theme + '\nお題：',
          50, [], 1.0);
        const clean = t.split('\n')[0].replace(/^[・\-\d.\s「『"]+|[」』"\s]+$/g,'').replace(/^お題[：:]/,'');
        if(clean.length>=10 && clean.length<=45 && /[？?]$/.test(clean) && clean!==lastOdai && !ex.includes(clean)) return (lastOdai = clean);
      }catch(e){ console.error(e); }
    }
  }
  let o; do{ o = ODAI[Math.random()*ODAI.length|0]; }while(o === lastOdai && ODAI.length>1);
  return (lastOdai = o);
}

// ===== 採点（判定はコード、AIは雰囲気だけ）=====
const FALLBACK = ['ふふっ、これは座布団1枚ですね！','それは予想外でした！','まさかの角度から来ました！','攻めすぎでは？でも好きです！','天才か事故か、紙一重！','じわじわ来ますね！','会場が一瞬静かになりました！','発想が自由すぎます！'];
const JUDGE_SYS = 'あなたは人気お笑い番組のノリのいい司会者です。大喜利の回答に10点満点で点数をつけ、ひとこと講評します。\n'
 + '・点数は5〜8点を中心に、最高に面白ければ9〜10点、微妙なら2〜4点\n'
 + '・講評は15〜25文字で、回答の言葉を拾ってツッコむかほめる。最後は「！」か「？」で終わる\n'
 + '・出力は必ず次の2行だけ\n点数:数字\n講評:ひとこと';
const JUDGE_SHOTS = [
 ['お題：犬が突然しゃべりだした。最初の一言は？\n回答：散歩はまだか','点数:8\n講評:しゃべれても考えることは散歩！'],
 ['お題：こんな配信者は嫌だ。どんな配信者？\n回答：開始5秒で寝る','点数:7\n講評:それもう配信じゃなくて睡眠！'],
 ['お題：カレーに入れてはいけないもの。それは？\n回答：あああ','点数:2\n講評:魂の叫びだけは伝わった！'],
 ['お題：魔王が勇者に言った意外な一言は？\n回答：その剣、メルカリで売れるよ','点数:10\n講評:魔王の目利きがリアルすぎる！']
];
async function judge(odai, a){
  let score = null, comment = '';
  if(engine){
    try{
      const t = await ask(JUDGE_SYS, `お題：${odai}\n回答：${a.text}`, 80, JUDGE_SHOTS, 0.8);
      const m = t.match(/点数\s*[:：]\s*(\d+)/);
      const c = t.match(/講評\s*[:：]\s*(.+)/);
      if(m) score = Math.min(10, Math.max(1, parseInt(m[1],10)));
      if(c){
        let cm = c[1].trim();
        if(cm.length>30){ const i = cm.search(/[。！？!?]/); cm = i>=4 ? cm.slice(0,i+1) : cm.slice(0,28)+'…'; }
        if(cm.length>=4) comment = cm;
      }
    }catch(e){ console.error(e); }
  }
  if(score === null) score = 3 + (Math.random()*7|0);
  if(!comment) comment = FALLBACK[Math.random()*FALLBACK.length|0];
  return {score, comment};
}
const reactEmoji = s => s>=9 ? '👑' : s>=7 ? '👏' : s>=5 ? '🙂' : '💦';

// ===== Twitchチャット（匿名接続）=====
let ws = null, collecting = false, answers = new Map();
const totals = new Map();
function connectChat(){
  const ch = $('ch').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(ws){ ws.onclose = null; ws.close(); }
  if(!ch) return;
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + (10000 + (Math.random()*80000|0)));
    ws.send('JOIN #' + ch);
  };
  ws.onmessage = ev => {
    for(const line of String(ev.data).split('\r\n')){
      if(line.startsWith('PING')){ ws.send('PONG :tmi.twitch.tv'); continue; }
      const m = line.match(/^(?:@(\S+) )?:([^!]+)![^ ]+ PRIVMSG #\S+ :(.*)$/);
      if(!m) continue;
      const tags = Object.fromEntries((m[1]||'').split(';').map(s => s.split('=')));
      const name = (tags['display-name'] || m[2]).replace(/\\s/g,' ');
      const text = m[3];
      if(text.startsWith('!')) continue;
      addAnswer(name, text);
    }
  };
  ws.onclose = () => setTimeout(connectChat, 5000);
}
function addAnswer(name, text){
  if(!collecting) return;
  text = text.trim().slice(0,40);
  if(!text || answers.has(name)) return;
  answers.set(name, {name, text});
  const d = document.createElement('div'); d.className = 'ans';
  d.innerHTML = '<div class="who"></div><b></b>';
  d.firstChild.textContent = name; d.lastChild.textContent = text;
  $('answers').prepend(d);
  $('cnt').textContent = answers.size; sfx('answer_in');
}
$('ch').onchange = connectChat;
$('btnTest').onclick = () => { const v = $('test').value; if(v){ addAnswer('テスト' + (answers.size+1), v); $('test').value=''; } };
$('test').onkeydown = e => { if(e.key==='Enter') $('btnTest').click(); };

// ===== ゲーム進行 =====
let skip = false, running = false;
$('btnSkip').onclick = () => skip = true;
$('btnStart').onclick = async () => {
  if(running){ running = false; skip = true; return; }
  running = true; $('btnStart').textContent = 'ゲーム停止'; connectChat();
  while(running){ await round(); if(running) await sleep(4000); }
  stopLoop(); $('btnStart').textContent = 'ゲーム開始'; $('btnSkip').disabled = true;
  $('phase').textContent = '停止しました'; $('timer').textContent = '';
};

async function round(){
  answers.clear(); $('answers').innerHTML = ''; $('ranking').innerHTML = ''; $('cnt').textContent = 0; skip = false;
  $('phase').textContent = 'お題を考え中…'; $('odai').textContent = '…';
  const odai = await makeOdai();
  $('odai').textContent = odai; $('phase').textContent = '回答受付中！チャットに書き込んでください'; sfx('odai_reveal');
  const sp = speak('お題です。' + odai);
  collecting = true; $('btnSkip').disabled = false;
  let left = parseInt($('sec').value, 10);
  while(left > 0 && !skip && running){ $('timer').textContent = '⏱ ' + left; if(left<=5) sfx('countdown_tick'); await sleep(1000); left--; }
  collecting = false; $('btnSkip').disabled = true; $('timer').textContent = ''; sfx('time_up');
  await sp; if(!running) return;
  let list = [...answers.values()];
  if(list.length === 0){ $('phase').textContent = '回答がありませんでした…'; sfx('no_answer'); await speak('回答がありませんでした。次のお題にいきましょう。'); return; }
  if(list.length > 12) list = list.sort(() => Math.random()-.5).slice(0,12); // 小さいAIでも間に合うよう最大12件
  $('phase').textContent = '採点中…'; startLoop('scoring_loop'); speak('それでは採点します。');
  const results = [];
  for(const a of list){
    if(!running) return;
    const j = await judge(odai, a);
    results.push({...a, ...j});
    totals.set(a.name, (totals.get(a.name)||0) + j.score);
    status('採点中 ' + results.length + '/' + list.length);
  }
  results.sort((x,y) => y.score - x.score);
  stopLoop(); $('phase').textContent = '結果発表！'; status('');
  await sfxWait('drumroll', 4000);
  const box = $('ranking');
  for(let i=0;i<results.length;i++){
    const r = results[i];
    const d = document.createElement('div'); d.className = 'rank' + (i===0?' top':'');
    d.innerHTML = '<div class="n"></div><div><b></b><div class="cm"></div></div><div class="pt"></div>';
    d.children[0].textContent = i+1; d.querySelector('b').textContent = r.text;
    d.querySelector('.cm').textContent = reactEmoji(r.score) + ' ' + r.name + '：' + r.comment; d.children[2].textContent = r.score + '点';
    box.appendChild(d);
  }
  renderTotals();
  // 上位3つだけ、盛り上げて読み上げ（3位→1位の順）
  const top = results.slice(0,3);
  for(let i=top.length-1;i>=0;i--){
    if(!running) return;
    const r = top[i];
    sfx(i===0 ? 'winner_fanfare' : 'rank_reveal');
    await speak(`第${i+1}位！`);
    if(r.score>=9) sfx('score_high'); else if(r.score<=3) sfx('score_low');
    await speak(`${r.name}さん。${r.text}。${r.score}点！${r.comment}`);
  }
  if(top[0] && running){ sfx('applause'); await speak(`今回の優勝は、${top[0].name}さんです！おめでとうございます！`); }
}
function renderTotals(){
  const t = $('totals'); t.innerHTML = '';
  [...totals.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([n,p],i)=>{
    const d = document.createElement('div'); d.className = 'total';
    d.innerHTML = '<span></span><b></b>'; d.firstChild.textContent = (i+1)+'. '+n; d.lastChild.textContent = p+'点'; t.appendChild(d);
  });
}
speechSynthesis?.getVoices?.();
status(navigator.gpu ? '準備OK（AIは任意）' : 'WebGPU非対応：AIなしモードで動きます');
</script>
</body>
</html>
